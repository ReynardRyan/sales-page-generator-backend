services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ai_sales_app
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      - app_storage:/var/www/html/storage
      - app_logs:/var/www/html/storage/logs
    networks:
      - ai_sales_network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: ai_sales_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ai_sales_network

volumes:
  app_storage:
  app_logs:
  redis_data:

networks:
  ai_sales_network:
    driver: bridge
