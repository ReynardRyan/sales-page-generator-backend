services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: ai_sales_app_dev
    restart: unless-stopped
    ports:
      - "8000:80"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - app_logs:/var/www/html/storage/logs
    networks:
      - ai_sales_dev_network
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: ai_sales_redis_dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - ai_sales_dev_network

volumes:
  app_logs:

networks:
  ai_sales_dev_network:
    driver: bridge
